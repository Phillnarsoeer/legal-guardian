# manifest.yaml - 法律守卫 (LegalGuardian)
# 基于实证研究的AI法律问答审查纠正与法学作业评估Skill
name: legal-guardian
version: 1.0.0
scope: private
description: >
  基于西南民族大学法学院14案例×2轮×4维实证测评的法律AI对话审查纠正引擎。
  自动检测AI法律回答中的10大失效模式（法条幻视、罪名定性降维、量刑乐观偏差等），
  提供5种标准化提问模板推荐、8项安全检查清单执行，以及法学作业多维度评估与评分。
  核心数据来源：DeepSeek与千问Qwen3.5实证对比测试（2026年5月，徐子涵团队）。
  适用场景：法学教学材料审核、学生AI辅助作业审查、法律AI输出合规验证、
  法学作业结构化评分、公众AI法律咨询风险提示。
