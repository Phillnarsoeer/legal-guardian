# manifest.yaml - 法律守卫 (LegalGuardian) v4.2.0
# 基于实证研究的AI法律问答审查纠正、法学全题型作业评估、教学合规审核与RAG增强Skill
name: legal-guardian
version: 4.2.0
scope: private
description: >
  基于西南民族大学法学院14案例×2轮×4维实证测评+人民法院案例库5,515真实案例+
  2022-2025年法考真题校准的法学全题型AI审查纠正与作业评估引擎。
  支持8大题型(T1-T8)自动识别与差异化评分、24种失效模式(F1-F24)检测，
  其中F19-F24为教信赛智慧评价赛道新增模式（试题歧义/评分尺度偏移/答案格式违规/
  跨题一致性破裂/采分点粒度失当/教学大纲合规偏离）。
  提供教学大纲AI合规审核、8项安全检查清单、客观题答案键对比、
  半客观题采分点覆盖、主观题五维加权评分与评分锚定校准。
  核心数据来源：DeepSeek与千问Qwen3.5实证对比测试（2026年5月，徐子涵团队）+
  人民法院案例库全量5,515案例（2026年7月，rmfyalk.court.gov.cn官方接口）+
  2022-2025年法考主客观真题校准+教育部法学类教学质量国家标准。
  适用场景：法学全题型作业批改（选择题/判断题/名词解释/简答题/论述题/法条分析/案例分析）、
  教学大纲AI合规审核、智能考试全流程管理、教学质量多维评价、
  法学教学材料审核、学生AI辅助作业审查、法律AI输出合规验证、
  公众AI法律咨询风险提示、RAG本地案例检索增强。
