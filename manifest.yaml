# manifest.yaml - 法律守卫 (LegalGuardian) v5.0.0
# AI法律输出审核纠正 + 法学全题型作业评估 + 教学合规审核 + 案例库检索 + 逻辑/形式化校验
name: legal-guardian
version: 5.0.0
scope: private
description: >
  基于西南民族大学法学院14案例×2轮×4维实证测评、人民法院案例库5,515真实案例、
  2022-2025年法考真题与教育部课程标准校准的AI法律审核与法学教学评估引擎。
  能力：24种失效模式(F1-F24)检测、8大题型(T1-T8)差异化评分、教学大纲AI合规审核、
  8项安全检查、5种提问模板推荐、三维规制符合性评估、5,515案例库本地检索、
  法条时效人工核验（离线链接+清单+留痕）、逻辑体检（5×4矩阵+8项筛查）、
  语义四格复核（M12/M32/M42/M52）、VeriCoT 完整版（FOL + 有限域 DPLL）。
  适用：AI法律回答审查纠正、法学作业批改、智能考试设计、教学质量评价、
  教学合规审核、法律AI输出验证。
